qwen:
  ollama_url: "http://localhost:11434"
  model: "qwen3:8b"
  temperature: 0.2
  timeout: 120
images:
  provider: "wikimedia_commons"
  commons_api: "https://commons.wikimedia.org/w/api.php"
  commons_file_page: "https://commons.wikimedia.org/wiki/"
